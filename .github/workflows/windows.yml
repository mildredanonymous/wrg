name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Portables Paket bauen und testen
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -SevenZip "$env:ProgramFiles\7-Zip\7z.exe"
      - name: Windows PowerShell 5.1 prüfen
        shell: powershell
        run: |
          Expand-Archive -Path artifacts/wrg-win-x64.zip -DestinationPath artifacts/powershell-51
          & ./artifacts/powershell-51/wrg-win-x64/wrg.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/powershell-51/wrg-win-x64/wrg.exe Zertifikat tests/fixtures/gemischt.pdf --exact --format jsonl
          exit $LASTEXITCODE
